apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${APP_NAME}-postgres
  namespace: ${K8S_NAMESPACE}
  labels:
    app: ${APP_NAME}-postgres
spec:
  serviceName: ${APP_NAME}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: ${APP_NAME}-postgres
  template:
    metadata:
      labels:
        app: ${APP_NAME}-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: ${APP_NAME}-postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ${APP_NAME}-postgres-data
